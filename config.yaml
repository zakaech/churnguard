# Configuration centrale de ChurnGuard.
seed: 42

paths:
  raw_data: data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv
  processed_dir: data/processed
  reports_dir: reports
  models_dir: models

kaggle:
  dataset: blastchar/telco-customer-churn
  filename: WA_Fn-UseC_-Telco-Customer-Churn.csv

split:
  # 60 / 20 / 20, stratifié sur la cible
  val_size: 0.2
  test_size: 0.2

columns:
  id: customerID
  target: Churn
  numeric:
    - tenure
    - MonthlyCharges
    - TotalCharges
  # SeniorCitizen est codé 0/1 : traité comme catégoriel (binaire)
  categorical:
    - gender
    - SeniorCitizen
    - Partner
    - Dependents
    - PhoneService
    - MultipleLines
    - InternetService
    - OnlineSecurity
    - OnlineBackup
    - DeviceProtection
    - TechSupport
    - StreamingTV
    - StreamingMovies
    - Contract
    - PaperlessBilling
    - PaymentMethod

cv:
  n_splits: 5

search:
  # Recherche aléatoire d'hyperparamètres : nombre de combinaisons par modèle
  n_iter: 25

threshold:
  # Objectif métier : détecter au moins 80 % des départs (rappel), en maximisant la précision
  target_recall: 0.80

mlflow:
  # Chemins relatifs à la racine du projet
  db: mlflow.db
  artifacts_dir: mlruns
  experiment: churnguard

model:
  version: "1.0.0"
  artifact: models/churnguard_model.joblib
  metadata: models/metadata.json
  # Release GitHub (option B) : publiée seulement après confirmation de la licence.
  # sha256 = empreinte du modèle évalué sur le test ; fetch_model.py la vérifie.
  release:
    repo: zakaech/churnguard
    tag: model-v1.0.0
    sha256: "871527ac90f0cc2393850df1f54dd05e97fa863d8f020f6ed6dd740f3324e08d"

# HYPOTHÈSES ILLUSTRATIVES (pas des données réelles de l'opérateur) :
# montants exprimés en mois de facture mensuelle médiane du train.
cost_analysis:
  lost_customer_months: 12   # valeur perdue quand un client part
  offer_months: 1            # coût d'une offre de fidélisation
  offer_success_rate: 0.30   # part des clients ciblés qui restent grâce à l'offre

# Niveaux de risque (API) : « élevé » = probabilité >= seuil du modèle (clients signalés),
# lu dans l'artefact. Sous le seuil : « moyen » si probabilité >= medium_from, sinon « faible ».
# 0.05 : rupture observée sur la VALIDATION (taux de départ 0,8-3,1 % en dessous, ~10-14 %
# au-dessus) ; voir README.
risk_levels:
  medium_from: 0.05

api:
  max_batch_size: 2000               # sans explications (~0,3 s mesuré pour 2 000 clients)
  max_batch_size_with_factors: 500   # avec SHAP (~17-18 s mesurés pour 2 000 clients)
