[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churnguard"
version = "0.1.0"
description = "Prédiction et explication du risque de départ des clients télécom"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "pyyaml",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
