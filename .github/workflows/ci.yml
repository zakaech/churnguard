# CI ChurnGuard : lint, tests et images Docker, sans Kaggle ni vrai modèle.
# - Les tests utilisent l'échantillon synthétique versionné (tests/data/sample.csv).
# - Le job docker entraîne un petit modèle de test sur cet échantillon et vérifie l'API
#   (santé, clé d'API, prédiction) et l'interface dans leurs conteneurs.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.3
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt
      - name: Installer les dépendances (versions figées)
        run: |
          pip install -r requirements-dev.txt -c constraints.txt
          pip install --no-deps -e .
      - name: Vérifier l'absence de données et de modèle réels
        run: |
          test ! -e data/raw/WA_Fn-UseC_-Telco-Customer-Churn.csv
          test ! -e models/churnguard_model.joblib
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    env:
      CHURNGUARD_API_KEY: cle-ci
    steps:
      - uses: actions/checkout@v4
      - name: Construire les images
        run: |
          docker build -f docker/api.Dockerfile -t churnguard-api:ci .
          docker build -f docker/ui.Dockerfile -t churnguard-ui:ci .
          docker images churnguard-*
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Entraîner un modèle de test (échantillon synthétique)
        run: |
          pip install -r requirements-api.txt -c constraints.txt
          PYTHONPATH=src python scripts/make_test_model.py --out ci-model
      - name: Lancer l'API et l'interface
        run: |
          docker network create churnguard
          docker run -d --name api --network churnguard -p 8000:8000 \
            -e CHURNGUARD_API_KEY -v "$PWD/ci-model:/app/models:ro" churnguard-api:ci
          docker run -d --name ui --network churnguard -p 8501:8501 \
            -e CHURNGUARD_API_KEY -e API_URL=http://api:8000 churnguard-ui:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 2; done
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8501/_stcore/health && break; sleep 2; done
      - name: Vérifier l'API (santé, clé d'API, prédiction)
        run: |
          PYTHONPATH=src python -c "import json; from churnguard.api.schemas import EXAMPLE_CUSTOMER; json.dump(EXAMPLE_CUSTOMER, open('client.json', 'w'))"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/predict \
            -H 'Content-Type: application/json' -d @client.json)" = 401
          curl -sf -X POST http://127.0.0.1:8000/predict -H 'Content-Type: application/json' \
            -H "X-API-Key: $CHURNGUARD_API_KEY" -d @client.json | tee prediction.json
          python -c "import json; p = json.load(open('prediction.json')); assert 0 <= p['churn_probability'] <= 1 and len(p['top_factors']) == 5"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8501/_stcore/health)" = 200
      - name: Journaux des conteneurs
        if: always()
        run: |
          docker logs api || true
          docker logs ui || true
